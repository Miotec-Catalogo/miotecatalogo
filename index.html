
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIOTEC | Catálogo de productos</title>
<style>
:root {
  --azul: #0755a5;
  --azul-oscuro: #082b50;
  --fondo: #f3f7fc;
  --texto: #172b43;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--texto);
  background: var(--fondo);
}
header {
  background: linear-gradient(120deg, #06284b, #0875ce);
  color: white;
  padding: 24px 6%;
}

.logo-miotec {
  display: block;
  width: 280px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  margin-bottom: 12px;
}
 font-size: 30px; font-weight: 800; letter-spacing: 2px; }
header p { margin-bottom: 0; color: #e0efff; }
main { max-width: 1200px; margin: auto; padding: 28px 20px; }
h1 { font-size: 28px; margin-bottom: 8px; }
.intro { color: #60748b; margin-top: 0; }
.busqueda {
  display: flex; gap: 10px; flex-wrap: wrap; margin: 24px 0;
}
input, select {
  padding: 13px; border: 1px solid #d5dfeb; border-radius: 9px;
  font-size: 15px; background: white;
}
input { flex: 1; min-width: 220px; }
button {
  background: var(--azul); color: white; border: 0;
  border-radius: 8px; padding: 12px 16px; cursor: pointer;
}
button:hover { background: #064580; }
.categorias { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.categorias button { background: white; color: var(--azul); border: 1px solid #d5dfeb; }
.categorias button.activo { background: var(--azul); color: white; }
.resumen { color: #63758b; font-size: 14px; margin-bottom: 15px; }
.productos {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px;
}
.tarjeta {
  background: white; border: 1px solid #e1e8f0; border-radius: 13px;
  overflow: hidden; box-shadow: 0 4px 15px #173b5c0a;
}
.foto {
  height: 175px; background: #eaf2fb; display: flex;
  align-items: center; justify-content: center; color: #6b88a6;
  font-size: 14px; text-align: center; padding: 12px;
}
.foto img { width: 100%; height: 100%; object-fit: contain; }
.info { padding: 15px; }
.codigo { color: #6b7f95; font-size: 12px; }
.nombre { font-size: 16px; line-height: 1.4; margin: 8px 0; }

.precio {
  font-size: 15px;
  font-weight: bold;
  margin: 0;
  color: #0755a5;
}

.mayor {
  font-size: 15px;
  font-weight: bold;
  color: #087a55;
  margin: 0;
}

.precio-box {
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: #f4f8fd;
  border: 1px solid #e0eaf5;
  border-radius: 8px;
  padding: 10px;
  margin-top: 9px;
}

.precio-etiqueta {
  font-size: 12px;
  color: #60748b;
  font-weight: normal;
}

.ver { width: 100%; margin-top: 12px; }
.vacio { grid-column: 1 / -1; padding: 35px; text-align: center; }
footer { padding: 25px; text-align: center; color: #6c7f94; font-size: 13px; }
dialog { border: 0; border-radius: 15px; width: min(520px, 92%); padding: 24px; }
dialog::backdrop { background: #061b30aa; }
.detalle-foto { width: 100%; max-height: 260px; object-fit: contain; background: #edf4fc; }
@media(max-width: 900px) { .productos { grid-template-columns: repeat(3, 1fr); } }
@media(max-width: 620px) {
  .productos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .foto { height: 135px; }
  .info { padding: 11px; }
  .nombre { font-size: 14px; }
  header { padding: 22px 5%; }
}
@media(max-width: 360px) { .productos { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <img src="./logo miotec" alt="Logo MIOTEC" class="logo-miotec">
  <p>EQUIPOS DE AUDIO Y TECNOLOGÍA</p>
</header>

<main>
  <h1>Catálogo de productos</h1>
  <p class="intro">Explora nuestros productos y consulta sus características.</p>

  <div class="busqueda">
    <input id="buscar" type="search" placeholder="Buscar por nombre o código..." aria-label="Buscar productos">
    <select id="orden" aria-label="Ordenar productos">
      <option value="original">Orden predeterminado</option>
      <option value="nombre">Nombre A-Z</option>
      <option value="precio">Precio: menor a mayor</option>
    </select>
  </div>

  <div class="categorias" id="categorias"></div>
  <div class="resumen" id="resumen"></div>
  <section class="productos" id="productos"></section>
</main>

<dialog id="modal">
  <img id="detalleImagen" class="detalle-foto" alt="">
  <p class="codigo" id="detalleCodigo"></p>
  <h2 id="detalleNombre"></h2>
  <p id="detalleDescripcion"></p>
  <p class="precio" id="detallePrecio"></p>
  <p class="mayor" id="detalleMayor"></p>
  <button onclick="document.getElementById('modal').close()">Cerrar detalles</button>
</dialog>

<footer>MIOTEC · Catálogo digital informativo</footer>

<script>
// Productos de demostración. Reemplazaremos estos datos por los productos reales de MIOTEC.
const productosDemo = [
  {codigo:"DEMO-001", nombre:"Audífonos de ejemplo", categoria:"Audífonos", precio:0, mayor:0, imagen:"", descripcion:"Producto de demostración. Aquí agregaremos las características técnicas reales."},
  {codigo:"DEMO-002", nombre:"Parlante de ejemplo", categoria:"Parlantes", precio:0, mayor:0, imagen:"", descripcion:"Producto de demostración. Aquí agregaremos las características técnicas reales."},
  {codigo:"DEMO-003", nombre:"Micrófono de ejemplo", categoria:"Micrófonos", precio:0, mayor:0, imagen:"", descripcion:"Producto de demostración. Aquí agregaremos las características técnicas reales."},
  {codigo:"DEMO-004", nombre:"Accesorio de ejemplo", categoria:"Accesorios", precio:0, mayor:0, imagen:"", descripcion:"Producto de demostración. Aquí agregaremos las características técnicas reales."}
];

let categoriaActiva = "Todas";

const formatoPrecio = valor => valor > 0
  ? "S/ " + Number(valor).toFixed(2)
  : "Por actualizar";

function dibujarCategorias(lista) {
  const nombres = ["Todas", ...new Set(lista.map(p => p.categoria).filter(Boolean))];
  document.getElementById("categorias").innerHTML = nombres.map(c =>
    `<button class="${c === categoriaActiva ? "activo" : ""}"
      onclick="elegirCategoria(${JSON.stringify(c).replace(/"/g, '&quot;')})">${c}</button>`
  ).join("");
}

function elegirCategoria(categoria) {
  categoriaActiva = categoria;
  dibujarCategorias(productosDemo);
  dibujarProductos();
}

function dibujarProductos() {
  const busqueda = document.getElementById("buscar").value.trim().toLowerCase();
  const orden = document.getElementById("orden").value;

  let lista = productosDemo.filter(p => {
    const coincide = (p.nombre + " " + p.codigo).toLowerCase().includes(busqueda);
    return coincide && (categoriaActiva === "Todas" || p.categoria === categoriaActiva);
  });

  if (orden === "nombre") lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  if (orden === "precio") lista.sort((a,b) => a.precio - b.precio);

  document.getElementById("resumen").textContent = lista.length + " producto(s)";
  document.getElementById("productos").innerHTML = lista.length
    ? lista.map(p => `
      <article class="tarjeta">
        <div class="foto">${p.imagen
          ? `<img src="${p.imagen}" alt="${p.nombre.replace(/"/g, '&quot;')}">`
          : "Fotografía del producto"}</div>
        <div class="info">
          <div class="codigo">Código: ${p.codigo}</div>
          <h2 class="nombre">${p.nombre}</h2>
          <div class="precio-box">
  <div class="precio-etiqueta">PRECIO POR UNIDAD</div>
  <div class="precio">${formatoPrecio(p.precio)}</div>
  <div class="precio-etiqueta">PRECIO POR MAYOR</div>
  <div class="mayor">${formatoPrecio(p.mayor)}</div>
</div>

          <button class="ver" onclick="verDetalle('${p.codigo}')">Ver detalles</button>
        </div>
      </article>`).join("")
    : '<div class="vacio">No se encontraron productos.</div>';
}

function verDetalle(codigo) {
  const p = productosDemo.find(item => item.codigo === codigo);
  if (!p) return;
  document.getElementById("detalleImagen").src = p.imagen || "";
  document.getElementById("detalleImagen").alt = p.nombre;
  document.getElementById("detalleImagen").style.display = p.imagen ? "block" : "none";
  document.getElementById("detalleCodigo").textContent = "Código: " + p.codigo;
  document.getElementById("detalleNombre").textContent = p.nombre;
  document.getElementById("detalleDescripcion").textContent = p.descripcion;
  document.getElementById("detallePrecio").textContent = "Precio por unidad: " + formatoPrecio(p.precio);
  document.getElementById("detalleMayor").textContent = "Precio por mayor: " + formatoPrecio(p.mayor);
  document.getElementById("modal").showModal();
}

document.getElementById("buscar").addEventListener("input", dibujarProductos);
document.getElementById("orden").addEventListener("change", dibujarProductos);

dibujarCategorias(productosDemo);
dibujarProductos();
</script>
</body>
</html>
